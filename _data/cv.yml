- title: Research Experience
  type: time_table
  contents:
    - title: Ph.D. Researcher
      institution: Starling Lab, University of Texas at Dallas
      year: 2020-2026
      maindescription: >
        <strong>Advisor:</strong> Prof. Sriraam Natarajan<br>
        Dissertation research on deep tractable probabilistic models,
        human-allied learning, and explainability in data-scarce domains.
        Developed a unified framework for incorporating expert domain knowledge
        into probabilistic circuits (AAAI 2025); introduced CSI-tree
        representations for extracting human-interpretable context-specific
        independencies from learned models (PGM 2022); proposed
        <em>Orient</em>, a submodular mutual information-based data subset
        selection framework for domain adaptation with 2-3&times; training
        speedups (NeurIPS 2022); and applied probabilistic models to clinical
        datasets for gestational diabetes prediction and knowledge extraction.
    - title: AI Research Intern
      institution: Altir LLC
      year: 2025
      maindescription: >
        Developed an interpretable, uncertainty-aware LLM agent by augmenting
        large language models with local tractable probabilistic reasoning,
        improving reliability through faithful uncertainty quantification.
    - title: Machine Learning Intern
      institution: RelationalAI Inc.
      year: 2020
      maindescription: >
        Built an interactive product recommendation tool using tractable
        probabilistic models; trained and evaluated boosted relational models
        on an online vendor catalog.

- title: Teaching Experience
  type: time_table
  contents:
    - title: Co-Instructor - Advanced Machine Learning (Industry Course)
      institution: Vistra Corporation / University of Texas at Dallas
      year: Aug. - Oct. 2021
      maindescription: >
        Co-designed and co-taught an eight-week intensive ML course for
        engineers at Vistra Corporation, with Prof. Sriraam Natarajan and
        Dr. Harsha Kokel. The curriculum covered core ML algorithms,
        probabilistic reasoning, and neural networks, with emphasis on
        motivation, transfer, and deployment in high-stakes settings.
        Teaching working professionals sharpened my focus on connecting
        formalism to problems that matter to practitioners.
    - title: Tutorial Presenter - Tractable Probabilistic Models
      institution: Indian Institute of Technology, Madras
      year: Mar. 2023
      maindescription: >
        Delivered a three-day tutorial on tractable probabilistic models to
        researchers and ML practitioners, co-presented with Prof. Natarajan,
        Dr. Saurabh Mathur, and Sahil Sidheekh. With a technically advanced
        audience and dense material, the focus was on building a coherent
        conceptual framework and bridging to adjacent areas of specialization.
    - title: Graduate Research Assistant and Mentor
      institution: Starling Lab, UT Dallas
      year: Aug. 2020 - May 2026
      maindescription: >
        Mentored undergraduate and graduate students in reading technical
        literature, forming research questions, debugging implementations, and
