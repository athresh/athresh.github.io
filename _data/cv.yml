- title: Research Experience
  type: time_table
  contents:
    - title: Ph.D. Researcher
      institution: Starling Lab, University of Texas at Dallas
      year: 2020-2026
      maindescription: >
        <strong>Advisor:</strong> Prof. Sriraam Natarajan<br>
        Dissertation research on deep tractable probabilistic models,
        human-allied learning, and explainability in data-scarce domains.
        Developed a unified framework for incorporating expert domain knowledge
        into probabilistic circuits (AAAI 2025); introduced CSI-tree
        representations for extracting human-interpretable context-specific
        independencies from learned models (PGM 2022); proposed
        <em>Orient</em>, a submodular mutual information-based data subset
        selection framework for domain adaptation with 2-3&times; training
        speedups (NeurIPS 2022); and applied probabilistic models to clinical
        datasets for gestational diabetes prediction and knowledge extraction.
    - title: AI Research Intern
      institution: Altir LLC
      year: 2025
      maindescription: >
        Developed an interpretable, uncertainty-aware LLM agent by augmenting
        large language models with local tractable probabilistic reasoning,
        improving reliability through faithful uncertainty quantification.
    - title: Machine Learning Intern
      institution: RelationalAI Inc.
      year: 2020
      maindescription: >
        Built an interactive product recommendation tool using tractable
        probabilistic models; trained and evaluated boosted relational models
        on an online vendor catalog.

- title: Teaching Experience
  type: time_table
