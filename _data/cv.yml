    - title: Co-Instructor - Advanced Machine Learning (Industry Course)
      institution: Vistra Corporation / University of Texas at Dallas
      year: Aug. - Oct. 2021
      maindescription: >
        Co-designed and co-taught an eight-week intensive ML course for
        engineers at Vistra Corporation, with Prof. Sriraam Natarajan and
